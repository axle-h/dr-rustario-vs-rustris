<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dr. Rustario vs. Rustris</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: sans-serif; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  #stage { position: relative; width: min(100vw, 1280px); }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           background: rgba(0, 0, 0, .85); cursor: pointer; font-size: 2rem; letter-spacing: .1em; }
  #status { position: absolute; left: 0; right: 0; bottom: .5rem; text-align: center;
            font-size: .9rem; color: #888; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="canvas" width="1280" height="720" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="start">&#9654; click to start</div>
  <div id="status"></div>
</div></div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    preRun: [function () {
      // config + high scores live in /data, persisted to IndexedDB
      FS.mkdir('/data');
      FS.mount(IDBFS, { autoPersist: true }, '/data');
      addRunDependency('idbfs');
      FS.syncfs(true, function (err) {
        if (err) console.error('idbfs load', err);
        removeRunDependency('idbfs');
      });
    }],
    setStatus: function (t) { statusEl.textContent = t; },
    onExit: function () { statusEl.textContent = 'stopped — reload the page to play again'; }
  };
  document.getElementById('start').addEventListener('click', function () {
    this.remove();
    Module.canvas.focus();
    // loading the game only after a user gesture keeps the browser happy to play audio
    var s = document.createElement('script');
    s.src = 'dr-rustario-vs-rustris.js';
    document.body.appendChild(s);
  }, { once: true });
</script>
</body>
</html>
