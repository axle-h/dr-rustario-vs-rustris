[package]
name = "dr-rustario"
version = "1.0.0"
authors.workspace = true
edition.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# all three halve the particle theme's mascot sheets in build.rs, the only user of `image`
portmaster = ["dep:image"]
browser = ["dep:image"]
android = ["dep:image"]

[build-dependencies]
image = { workspace = true, optional = true }

[dev-dependencies]
mockall = "0.15.0"
engine = { path = "../engine" }

[dependencies]
engine = { path = "../engine" }
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
sdl2.workspace = true
strum.workspace = true
strum_macros.workspace = true
num-format.workspace = true

[target.'cfg(not(any(target_os = "emscripten", target_os = "android")))'.dependencies]
# training only (the ga subcommand); the browser and Android builds compile neither
rayon = "1.12"
