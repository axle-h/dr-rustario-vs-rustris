[package]
name = "dr-rustario"
version = "1.0.0"
authors.workspace = true
edition.workspace = true
build = "build.rs"

[features]
# both halve the particle theme's mascot sheets at build time - see build.rs, which is the
# only thing `image` is here for
portmaster = ["dep:image"]
browser = ["dep:image"]

[build-dependencies]
image = { workspace = true, optional = true }

[dev-dependencies]
mockall = "0.15.0"
engine = { path = "../engine" }

[dependencies]
engine = { path = "../engine" }
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
sdl2.workspace = true
strum.workspace = true
strum_macros.workspace = true
num-format.workspace = true

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
# training only (the ga subcommand); the browser build compiles neither
rayon = "1.12"
