[package]
name = "engine"
version = "0.1.0"
authors.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# How SDL2 is found. Neither is a default here, since every crate depending on engine would
# pull it in: the launcher's `default` decides.
vcpkg = ["sdl2/static-link", "sdl2/use-vcpkg"]
pkgconfig = ["dep:sdl2-sys"]
portmaster = []
browser = []
android = []

[dependencies]
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
sdl2.workspace = true
ab_glyph.workspace = true
image.workspace = true
confy.workspace = true
num-format.workspace = true
symphonia.workspace = true
strum.workspace = true
strum_macros.workspace = true
itertools = "0.15"
num-bigint = "0.5"
num-traits = "0.2"

# `pkgconfig` enables this rather than `sdl2/use-pkgconfig` because cargo drops a feature edge
# to a dependency the target lacks, so the feature is absent on Windows, where a pkg-config
# probe would panic the build before vcpkg is reached.
[target.'cfg(all(not(windows), not(target_os = "emscripten")))'.dependencies]
sdl2-sys = { workspace = true, features = ["use-pkgconfig"], optional = true }

[target.'cfg(windows)'.dependencies]
sdl2 = { workspace = true, features = ["static-link", "use-vcpkg"] }

[target.'cfg(not(any(target_os = "emscripten", target_os = "android")))'.dependencies]
# training only (the ga subcommand), which the browser and Android builds leave out
rayon = "1.12"

[dev-dependencies]
approx = "0.5"
