[workspace]
resolver = "2"
members = ["engine", "dr-rustario", "rustris", "puyo-rusto", "rustle-fighter", "launcher"]
default-members = ["launcher"]

[workspace.package]
authors = ["Alex Haslehurst"]
edition = "2021"

[workspace.dependencies]
rand = "0.10.2"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
sdl2 = { version = "0.38.0", default-features = false }
# direct so engine/Cargo.toml can enable `use-pkgconfig` per target; must match sdl2's version
sdl2-sys = { version = "0.38.0", default-features = false }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
confy = { version = "2.0.0", default-features = false, features = ["yaml_conf"] }
num-format = "0.4.4"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
titlecase = "3.6.0"

[workspace.lints.clippy]
# a `debug_assert!` skips its arguments in release, so nothing the game needs may be made in one
debug_assert_with_mut_call = "deny"

[profile.release]
strip = "symbols"
