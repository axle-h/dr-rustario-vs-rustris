[workspace]
resolver = "2"
members = ["engine", "dr-rustario", "rustris", "puyo-rusto", "launcher"]
default-members = ["launcher"]

[workspace.package]
authors = ["Alex Haslehurst"]
edition = "2021"

[workspace.dependencies]
rand = "0.10.2"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
sdl2 = { version = "0.38.0", default-features = false }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
confy = { version = "2.0.0", default-features = false, features = ["yaml_conf"] }
num-format = "0.4.4"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
titlecase = "3.6.0"

[workspace.lints.clippy]
# A `debug_assert!` does not evaluate its arguments at all in a release build, so a value the
# game needs cannot be produced inside one - which is how every versus ai mode came to panic
# the moment a match started in a release build and in no test run at all.
debug_assert_with_mut_call = "deny"

[workspace.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
tag = "2024.10.21"
dependencies = ["sdl2"]

[workspace.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }

[profile.release]
strip = "symbols"
