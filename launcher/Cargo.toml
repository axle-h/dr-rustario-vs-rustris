[package]
name = "dr-rustario-vs-rustris"
version = "2.0.0"
authors.workspace = true
edition.workspace = true
build = "build.rs"

# cargo-vcpkg only reads `package.metadata` and only from the crate `cargo metadata` was asked
# about, so this cannot live in the workspace manifest: run it as
# `cargo vcpkg build --manifest-path launcher/Cargo.toml`.
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
tag = "2024.10.21"
dependencies = ["sdl2"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }

[lints]
workspace = true

[[bin]]
name = "dr-rustario-vs-rustris"
path = "src/main.rs"

[features]
default = ["pkgconfig"]
vcpkg = ["engine/vcpkg"]
pkgconfig = ["engine/pkgconfig"]
portmaster = ["engine/portmaster", "dr-rustario/portmaster"]
browser = ["engine/browser", "dr-rustario/browser"]

[build-dependencies]
built = { version = "0.8.1", default-features = false, features = [] }
embed-resource = "3.0.11"

[dependencies]
engine = { path = "../engine" }
dr-rustario = { path = "../dr-rustario" }
rustris = { path = "../rustris" }
puyo-rusto = { path = "../puyo-rusto" }
sdl2.workspace = true
titlecase.workspace = true

[dev-dependencies]
# examples/frame_shot.rs writes a rendered frame straight to a png
image.workspace = true
