[package]
name = "dr-rustario-vs-rustris"
version = "2.0.0"
authors.workspace = true
edition.workspace = true
build = "build.rs"

# cargo-vcpkg reads only this crate's metadata:
# `cargo vcpkg build --manifest-path launcher/Cargo.toml`
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
tag = "2026.07.29"
dependencies = ["sdl2"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }

[lints]
workspace = true

# The game is a library so Android can load it; build-android.sh builds the cdylib, and the
# name differs from the bin's because equal names collide in `cargo doc` and the Windows .pdb.
[lib]
name = "launcher"
path = "src/lib.rs"

[[bin]]
name = "dr-rustario-vs-rustris"
path = "src/main.rs"

[features]
# `pkgconfig` is the default and a no-op where there is no pkg-config. `vcpkg` is the
# alternative and needs `--no-default-features`, since sdl2-sys probes both when given both.
default = ["pkgconfig"]
vcpkg = ["engine/vcpkg"]
pkgconfig = ["engine/pkgconfig"]
# `portmaster`, `browser` and `android` are mutually exclusive
portmaster = ["engine/portmaster", "dr-rustario/portmaster"]
browser = ["engine/browser", "dr-rustario/browser"]
# built only through build-android.sh
android = ["engine/android", "dr-rustario/android"]
# every `GameKind::RustleFighter` arm is `#[cfg]`'d on this, so a plain build carries none of
# its code, assets or menu entry
rustle-fighter = ["dep:rustle-fighter"]

[build-dependencies]
built = { version = "0.8.1", default-features = false, features = [] }
embed-resource = "3.0.11"

[dependencies]
engine = { path = "../engine" }
dr-rustario = { path = "../dr-rustario" }
rustris = { path = "../rustris" }
puyo-rusto = { path = "../puyo-rusto" }
rustle-fighter = { path = "../rustle-fighter", optional = true }
sdl2.workspace = true
titlecase.workspace = true

[dev-dependencies]
image.workspace = true
