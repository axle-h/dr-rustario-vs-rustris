[package]
name = "rustle-fighter"
version = "1.0.0"
authors.workspace = true
edition.workspace = true

[lints]
workspace = true

[dev-dependencies]
# only to decode this theme's own png in a test: the sheet is cut by `art/rip.py` and the
# theme has to agree with the script about which cell is which sprite - see
# `theme::arcade`. Nothing in the crate proper reads a png; the engine loads them through SDL.
image.workspace = true

[dependencies]
engine = { path = "../engine" }
rand.workspace = true
rand_chacha.workspace = true
sdl2.workspace = true
strum.workspace = true
strum_macros.workspace = true
